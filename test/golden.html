<!doctype html><meta charset="utf-8"><title>FC-A02 golden comparison</title>
<pre id="out">running</pre>
<script type="module">
import { loadFonts } from '../site/label/fonts.js';
import { standardByKey } from '../site/label/standards.js';
import { renderLabel } from '../site/label/render.js';
import { SEED } from '../site/registry/seed.js';
import { svgToCanvas } from '../site/export/png.js';
const fonts = await loadFonts('../site/fonts/');
const icons = await (await fetch('../site/icons/tabler.json')).json();
const std = standardByKey('bisley');
const NAME = { D1: 'D1_Test', D2: 'D2_Rework', D3: 'D3_Power', '01': '01_Desk', '02': '02_Handtools', '03': '03_Solder', '04': '04_Drivers', '05': '05_Passives', '06': '06_Semis', '07': '07_Boards', '08': '08_Connectors', '09': '09_Wire', 10: '10_Fasteners', F1: 'F1_Proto', F2: 'F2_Projects', F3: 'F3_Files' };
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const bounds = (d, w, h) => { let x0 = w, x1 = -1, y0 = h, y1 = -1; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4] < 200) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; };
const out = [];
for (const d of SEED) {
  const c = await svgToCanvas(renderLabel(fonts, std, d, icons[d.icon][0]), 520, 260, true);
  const g = document.createElement('canvas'); g.width = c.width; g.height = c.height;
  const img = await load(`golden/Bisley_Label_${NAME[d.id]}_v3.png`);
  const gx = g.getContext('2d'); gx.drawImage(img, 0, 0);
  const a = c.getContext('2d').getImageData(0, 0, c.width, c.height).data, b = gx.getImageData(0, 0, c.width, c.height).data;
  let sum = 0, big = 0; for (let i = 0; i < a.length; i += 4) { const e = Math.abs(a[i] - b[i]); sum += e; if (e > 96) big++; }
  const ba = bounds(a, c.width, c.height), bb = bounds(b, c.width, c.height);
  out.push({ id: d.id, size: [c.width, c.height, img.width, img.height].join(), mean: +(sum / (a.length / 4)).toFixed(3), big, dBounds: ba.map((v, i) => v - bb[i]).join() });
}
window.RESULT = out;
document.getElementById('out').textContent = JSON.stringify(out, null, 0).replace(/},/g, '},\n');
</script>
